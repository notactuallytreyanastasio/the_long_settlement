<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Long Settlement</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: #050403; overflow: hidden; }
  body {
    display: grid; place-items: center;
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    color: #eadcc0;
    -webkit-user-select: none; user-select: none;
  }
  canvas#stage { display: block; background: #000; outline: none; touch-action: none; box-shadow: 0 0 80px rgba(0, 0, 0, 0.9); }

  #gate {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: radial-gradient(ellipse at 50% 40%, rgba(22, 16, 10, 0.72), rgba(5, 4, 3, 0.94));
    text-align: center;
  }
  #gate[hidden], #fatal[hidden], #muted[hidden], #resume[hidden] { display: none; }
  #gate .card { max-width: 34rem; padding: 2rem; }
  #gate .over { letter-spacing: 0.5em; font-size: 0.75rem; color: #c9a25a; text-transform: uppercase; margin: 0 0 1rem 0.5em; }
  #gate h1 { font-weight: 600; font-size: clamp(2rem, 6vw, 3.4rem); margin: 0; color: #fff3d6; text-shadow: 0 0 28px rgba(255, 170, 70, 0.45); }
  #gate p { font-style: italic; color: rgba(234, 220, 192, 0.72); line-height: 1.5; margin: 1rem 0 1.8rem; }
  #gate button {
    display: block; width: 100%; margin: 0.6rem auto; padding: 0.85rem 1.4rem;
    font: inherit; font-size: 1.1rem; color: #1a1208; cursor: pointer;
    background: linear-gradient(#f4dc9c, #c9a25a); border: 1px solid #6b4f22; border-radius: 6px;
  }
  #gate button#resume { background: transparent; color: #f4dc9c; border-color: rgba(201, 162, 90, 0.6); }
  #gate button:disabled { opacity: 0.4; cursor: default; }
  #gate button:focus-visible { outline: 2px solid #fff3d6; outline-offset: 3px; }
  #gate dl { display: grid; grid-template-columns: auto auto; gap: 0.3rem 1.2rem; justify-content: center; margin: 1.6rem 0 0; font-size: 0.85rem; color: rgba(234, 220, 192, 0.6); text-align: left; }
  #gate dt { font-family: "SF Mono", Menlo, Consolas, monospace; color: #c9a25a; text-align: right; }
  #gate dd { margin: 0; }

  #muted { position: fixed; top: 0.8rem; right: 1rem; font-size: 0.8rem; letter-spacing: 0.2em; color: #c9a25a; text-transform: uppercase; }
  #fatal {
    position: fixed; inset: 0; margin: 0; padding: 2rem; overflow: auto; white-space: pre-wrap;
    background: rgba(20, 4, 2, 0.96); color: #ffb9a8; font: 13px/1.5 "SF Mono", Menlo, Consolas, monospace;
    -webkit-user-select: text; user-select: text;
  }
</style>
</head>
<body>
<canvas id="stage" tabindex="0" aria-label="The Long Settlement"></canvas>

<div id="gate">
  <div class="card">
    <div class="over">A voiced story on a pinball table</div>
    <h1>The Long Settlement</h1>
    <p>Every note reads: payable in stillness. It is best with sound on.</p>
    <button id="begin" disabled>Begin</button>
    <button id="resume" hidden></button>
    <dl>
      <dt>&larr; &rarr; &nbsp;or&nbsp; Z /</dt><dd>flippers (the Shift keys too)</dd>
      <dt>Space</dt><dd>hold and release to plunge</dd>
      <dt>Enter</dt><dd>spin, borrow, next line</dd>
      <dt>P &nbsp; R</dt><dd>to the table, back to the Reels</dd>
      <dt>S &nbsp; M</dt><dd>skip a scene, mute</dd>
    </dl>
  </div>
</div>

<div id="muted" hidden>muted</div>
<pre id="fatal" hidden></pre>

<script type="module" src="src/shell/main.js"></script>
</body>
</html>
