<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Cel characters</title>
<style>
  html, body { margin: 0; height: 100%; background: #10183a; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: fixed; left: 8px; bottom: calc(8px + env(safe-area-inset-bottom)); font: 10px/1.35 ui-monospace, Menlo, monospace; color: #fff; background: rgba(16, 24, 58, 0.55); padding: 4px 6px; border-radius: 6px; white-space: pre; pointer-events: none; }
  #bar { position: fixed; right: 8px; bottom: calc(8px + env(safe-area-inset-bottom)); display: flex; gap: 6px; }
  #bar button { font: 12px ui-monospace, Menlo, monospace; color: #fff; background: rgba(16, 24, 58, 0.6); border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 6px; padding: 6px 9px; }
  .tag { position: fixed; font: 600 9px/1 ui-monospace, Menlo, monospace; color: #fff; text-shadow: 0 1px 0 #1d2146, 0 0 3px #1d2146; pointer-events: none; }
  [hidden] { display: none !important; }
  #fatal { position: fixed; inset: 0; margin: 0; padding: 16px; font: 12px/1.4 ui-monospace, Menlo, monospace; color: #ffd9d0; background: #2a1020; white-space: pre-wrap; overflow: auto; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="tags"></div>
<div id="hud"></div>
<div id="bar"><button id="bLight">light</button><button id="bView">view</button><button id="bWho">who</button></div>
<pre id="fatal" hidden></pre>
<script type="module">
// The cast on a quay: contact sheets for the character artist. Query string:
//   ?view=sheet (default)  one row per character: body, four emotes close up, and the stage-size figure (lod 'stage').
//                          ?page=0.. (8 rows a page)  ?ids=ren,ilse,... (default: all of CAST)
//        =heads            big heads of ?ids, three across (12 a page)   ?emote= ?speak=1 ?lod=
//        =lineup           every id at stage size, in 430 x 220 bands as the live view draws them (lod 'stage')
//        =close            ?who alone, head and shoulders, full detail      =turn  ?who from four sides
//        =emotes           ?who, all seven emotes and talking               =poses ?ids, signature poses
//        =clips            every clip of ?who at the moment it lands        =act   ?who playing ?act (or cycling)
//        =strip            ?who over time, ?n frames ?step seconds apart: ?act=clip | ?emote=a,b (switches halfway) | ?speak=1 | ?wind=1 | ?turn=1
//        =crowd            createCrowd: ?count=28 ?mood=idle|cheer|angry|still  (add &strip=1 for six frames of it)
//   ?light=sunset | night | day      ?who=<id>      ?emote= ?pose=signature ?speak=1 ?look=camera
//   ?lod=full|stage (close, turn, emotes, strip)    ?yaw=30    ?t=6 (freeze)    ?hud=0    ?dpr=1
const fatal = (e) => { const f = document.getElementById('fatal'); f.hidden = false; f.textContent = String((e && e.stack) || e); window.glDemo = { error: f.textContent }; };
window.addEventListener('error', (e) => fatal(e.error || e.message));
window.addEventListener('unhandledrejection', (e) => fatal(e.reason));
try {
  const GL = await import('../src/shell/gl/index.js');
  const { createFaces } = await import('../src/shell/gl/faces.js');
  const { createCharacter, createCrowd, castVariant, CAST, CLIPS, EMOTES, figureMaterial, teamMove } = await import('../src/shell/gl/characters.js');
  const { createRenderer, createCamera, createScene, makeEnv, material, node, group, mergeStatic, createSprites, createClouds, merge, tint, place, roundedBox, cylinder, lathe, sphere, blob, setGlow, rng, DEG } = GL;

  const q = new URLSearchParams(location.search);
  const LIGHTS = ['sunset', 'night', 'day'], VIEWS = ['sheet', 'heads', 'lineup', 'close', 'turn', 'emotes', 'poses', 'clips', 'act', 'strip', 'crowd'];
  const light = q.get('light') || 'sunset', view = q.get('view') || 'sheet', who = q.get('who') || 'ilse';
  if (!LIGHTS.includes(light)) throw new Error(`unknown light "${light}" (have ${LIGHTS.join(', ')})`);
  if (!VIEWS.includes(view)) throw new Error(`unknown view "${view}" (have ${VIEWS.join(', ')})`);
  const fixedT = q.has('t') ? Number(q.get('t')) : null;
  const canvas = document.getElementById('c');
  const renderer = createRenderer(canvas, { dprCap: Number(q.get('dpr') || 2) });

  // ---- the set: a quay of warm stone, the sea behind, one harbour lamp
  const LAMP = [1.55, 1.62, -0.9], night = light === 'night', lamps = night ? 1.2 : light === 'sunset' ? 0.7 : 0;
  const env = makeEnv(light, {
    water: { level: -0.55, shores: [] },
    points: [{ pos: LAMP, color: '#ffb050', radius: 5.2, intensity: lamps }],
    ...(light === 'sunset' ? { key: { dir: [-0.62, 0.36, 0.62] } } : {}),
    // night: a bright moon from the front and a blue shadow that keeps its colour, so faces do not go to slate
    ...(night ? { key: { dir: [-0.35, 0.6, 0.7], color: '#cdd9ff' }, shadow: { tint: '#4a5fd0', lift: 0.16, saturate: 1.3 }, ambient: { amount: 0.2 } } : {}),
  });
  env.shadow.radius = 3.2; env.shadow.center = [0, 0.4, 0];
  const scene = createScene(env);
  const mat = material({ name: 'set' }), ground = material({ name: 'ground', rim: 0 });
  const set = group('set');
  set.add(node('quay', tint(place(roundedBox(14, 1.2, 5.2, 0.08, 2), 0, -0.6, -0.3), '#f6e4b8'), ground));
  const r = rng(7);
  for (let i = 0; i < 26; i++) { const x = (r() - 0.5) * 9, z = -2.2 + r() * 3.6, s = 0.22 + r() * 0.3; set.add(node('slab', tint(place(roundedBox(s * 1.6, 0.02, s, 0.008, 1), x, 0.004, z, 0, (r() - 0.5) * 16, 0), r() > 0.5 ? '#fff0cc' : '#ecd29c'), ground)); }
  // a low sea wall, a bollard, crates and the lamp post
  set.add(node('wall', tint(place(roundedBox(14, 0.34, 0.3, 0.06, 2), 0, 0.17, -2.6), '#ffeecb'), mat));
  set.add(node('bollard', merge(tint(lathe([[0.16, 0], [0.14, 0.3], [0.2, 0.36], [0.2, 0.44], [0, 0.5]], 14), '#4a5a9a'), tint(place(cylinder(0.205, 0.205, 0.05, 14), 0, 0.3, 0), '#ffd24a')), mat, { pos: [-1.75, 0, -1.5] }));
  set.add(node('crate', merge(tint(roundedBox(0.5, 0.5, 0.5, 0.03, 2), '#d9964e'), tint(roundedBox(0.54, 0.09, 0.54, 0.02, 1), '#b06f34')), mat, { pos: [2.25, 0.25, -1.7], rot: [0, 22, 0] }));
  set.add(node('post', merge(
    tint(lathe([[0.1, 0], [0.07, 0.12], [0.045, 0.2], [0.04, 1.45], [0.07, 1.5], [0, 1.5]], 10), '#3d4a8a'),
    tint(place(lathe([[0.05, 0], [0.13, 0.03], [0.15, 0.24], [0.06, 0.3], [0, 0.34]], 10, { crease: 40 }), 0, 1.72, 0), '#3d4a8a'),
    setGlow(tint(place(cylinder(0.1, 0.12, 0.22, 10, { caps: false }), 0, 1.5, 0), lamps > 0 ? '#ffe9a0' : '#fff6dc'), lamps > 0 ? 1 : 0)), mat, { pos: [LAMP[0], 0, LAMP[2]] }));
  scene.root.add(mergeStatic(set, 'set'));
  const clouds = createClouds({ count: 8, seed: 3, arc: [120, 240], height: [12, 90], speed: 0.1, shadowTint: light === 'day' ? '#b9c8f6' : light === 'sunset' ? '#c77fb0' : '#3b4fa8', color: night ? '#8fa4e6' : light === 'sunset' ? '#ffd9b8' : '#ffffff' });
  scene.root.add(clouds.node);
  const sprites = scene.sprites = createSprites(128);
  if (lamps > 0) sprites.add({ kind: 'glow', pos: [LAMP[0], LAMP[1], LAMP[2]], size: 2.0, color: '#ffa63f', alpha: 0.75 });

  // ---- the cast. Figures are lit as the game lights them: a key that follows the camera (stage.js createTroupe.aim)
  const keyLight = new Float32Array([-0.4, 0.55, 0.73]);
  const figMat = figureMaterial({ keyLight });
  const faces = createFaces({ figure: figMat });
  const ALL = Object.keys(CAST).filter((id) => id !== 'crowd');
  const want = q.get('ids') ? q.get('ids').split(',') : null;
  const lodQ = q.get('lod') || 'full', PAGE = 8, page = Number(q.get('page') || 0);
  let ids, lods;
  if (view === 'sheet') { ids = (want || ALL).slice(page * PAGE, page * PAGE + PAGE); lods = ['full', 'stage']; }
  else if (view === 'lineup') { ids = want || ALL; lods = ['stage']; }
  else if (view === 'heads') { ids = (want || ALL).slice(page * 12, page * 12 + 12); lods = [lodQ]; }
  else if (view === 'poses') { ids = want || ['ren', 'ilse', 'nan', 'bailiff']; lods = ['full']; }
  else if (view === 'crowd') { ids = []; lods = []; }
  else if (view === 'act' && q.get('act') === 'team') { ids = ['ren', 'ilse', 'bailiff']; lods = [lodQ]; }
  else { ids = [who]; lods = [lodQ]; }
  const defOf = (id) => { const [base, k] = id.split('#'); if (!CAST[base]) throw new Error(`no cast member "${base}" (have ${Object.keys(CAST).join(', ')})`); return castVariant(base, Number(k || 0)); };
  const cast = {}, keys = [];
  for (const id of ids) for (const lod of lods) {
    const key = lods.length > 1 ? `${id}@${lod}` : id;
    const ch = cast[key] = createCharacter(defOf(id), { faces, material: figMat, detail: Number(q.get('detail') || 1), lod });
    scene.root.add(ch.root); keys.push(key);
    ch.glow = ch.lampPos ? sprites.add({ kind: 'glow', pos: [0, 0, 0], size: 0.8, color: '#ffa63f', alpha: lamps > 0 ? 0.8 : 0.35 }) : null;
  }
  const crowd = view === 'crowd' ? createCrowd({ count: Number(q.get('count') || 28), seed: Number(q.get('seed') || 3), area: { x0: -2.4, x1: 2.4, z0: -1.4, z1: 0.9 }, face: 0, material: figMat }) : null;
  if (crowd) scene.root.add(crowd.root);

  // ---- views: a list of cells, each a rectangle of the canvas with its own camera and its own state for the cast
  const cam = createCamera({ fov: 24, near: 0.2, far: 1200 });
  const tags = document.getElementById('tags');
  const tag = (x, y, text) => { const d = document.createElement('div'); d.className = 'tag'; d.style.left = x + 'px'; d.style.top = y + 'px'; d.textContent = text; tags.appendChild(d); };
  const base = { emote: (q.get('emote') || 'neutral').split(',')[0], pose: q.get('pose') || 'stand', speaking: q.get('speak') === '1', look: q.get('look') === 'camera' ? 'camera' : null };
  const camYaw = Number(q.get('yaw') || 0), stripN = Number(q.get('n') || 8), stripStep = Number(q.get('step') || 0.1);
  /** cell: { x, y, w, h, show: [keys], at: { key: [x, z] }, shot: 'body' | 'head' | 'bust' | 'band' | 'wide', of: key, yaw, pitch, margin, state: { key: {...} }, act: [clip, at], advance: seconds } */
  function layout(W, H) {
    tags.textContent = ''; const cells = [];
    const FOUR = ['neutral', 'smile', 'anger', 'shock'];
    if (view === 'sheet') {
      const rh = Math.floor(H / PAGE), bw = Math.round(W * 0.2), sw = Math.round(W * 0.19), ew = (W - bw - sw) / 4;
      ids.forEach((id, r) => { const y = r * rh, F = `${id}@full`, S = `${id}@stage`;
        cells.push({ x: 0, y, w: bw, h: rh, show: [F], shot: 'body', of: F, yaw: r % 2 ? 24 : -24, pitch: 6, margin: 1.16, state: { [F]: { face: 0 } } });
        FOUR.forEach((e, i) => cells.push({ x: bw + i * ew, y, w: ew, h: rh, show: [F], shot: 'head', of: F, yaw: i % 2 ? -20 : 20, pitch: 3, margin: 1.36, state: { [F]: { emote: e, look: 'camera', face: 0, talk: e === 'smile' ? 0.8 : 0 } } }));
        // the stage-size figure: 76 px tall, as the live band draws it
        cells.push({ x: bw + 4 * ew, y, w: sw, h: rh, show: [S], shot: 'body', of: S, yaw: 28, pitch: 8, margin: rh / 76, thin: true, state: { [S]: { face: 0 } } });
        tag(2, y + 2, `${id}  ${cast[F].stats.triangles} / ${cast[S].stats.triangles} tris`); });
      FOUR.forEach((e, i) => tag(bw + i * ew + 2, H - 12, e)); tag(bw + 4 * ew + 2, H - 12, 'stage 76px');
    } else if (view === 'heads') { // big heads, three across: the faces as a cutscene close-up shows them
      const cols = Number(q.get('cols') || 3), rows = Math.ceil(ids.length / cols), cw = W / cols, chh = Math.min(H / rows, cw * 1.15);
      ids.forEach((id, i) => { const x = (i % cols) * cw, y = Math.floor(i / cols) * chh; cells.push({ x, y, w: cw, h: chh, show: [id], shot: 'head', of: id, yaw: camYaw + (i % 2 ? -18 : 18), pitch: 3, margin: 1.4, state: { [id]: { look: 'camera', face: 0, emote: base.emote, talk: base.speaking ? 0.7 : 0 } } }); tag(x + 3, y + 3, id); });
    } else if (view === 'lineup') {
      const bh = Math.round(W * 220 / 430), per = 7;
      for (let b = 0; b * per < ids.length; b++) { const row = ids.slice(b * per, b * per + per), at = {}, st = {};
        row.forEach((id, i) => { at[id] = [(i - (row.length - 1) / 2) * 0.82, (i % 2) * 0.25]; st[id] = { face: i < row.length / 2 ? 50 : -50, emote: ['neutral', 'smile', 'grim', 'anger'][(i + b) % 4] }; });
        cells.push({ x: 0, y: b * (bh + 12), w: W, h: bh, show: row, at, shot: 'band', yaw: 0, pitch: 8, state: st, thin: true }); tag(2, b * (bh + 12) + 2, row.join('  ')); }
    } else if (view === 'emotes') {
      const all = [...EMOTES, 'talk'], cols = 2, rows = 4, cw = W / cols, chh = H / rows;
      all.forEach((e, i) => { const x = (i % cols) * cw, y = Math.floor(i / cols) * chh;
        cells.push({ x, y, w: cw, h: chh, show: [who], shot: 'head', of: who, yaw: (i % 2 ? -1 : 1) * 22, pitch: 3, margin: 1.45, state: { [who]: e === 'talk' ? { emote: 'smile', talk: 0.8, look: 'camera', face: 0 } : { emote: e, look: 'camera', face: 0 } } }); tag(x + 3, y + 3, e); });
    } else if (view === 'turn') { [0, 40, 90, 150, 180, -60].forEach((yw, i) => { cells.push({ x: (i % 3) * W / 3, y: Math.floor(i / 3) * H / 2, w: W / 3, h: H / 2, show: [who], shot: i === 4 ? 'head' : 'body', of: who, yaw: yw, pitch: 6, margin: i === 4 ? 1.5 : 1.25, state: { [who]: { face: 0 } } }); }); }
    else if (view === 'close') cells.push({ x: 0, y: 0, w: W, h: H, show: [who], shot: q.get('shot') || 'head', of: who, margin0: 1, yaw: camYaw + 16, pitch: 4, margin: 1.5, state: { [who]: { look: 'camera', face: 0 } } });
    else if (view === 'poses') ids.forEach((id, i) => { const n = Math.ceil(ids.length / 2), x = (i % 2) * W / 2, y = Math.floor(i / 2) * H / n; cells.push({ x, y, w: W / 2, h: H / n, show: [id], shot: 'body', of: id, yaw: i % 2 ? 26 : -26, pitch: 6, margin: 1.4, state: { [id]: { pose: 'signature', face: 0, emote: 'smile' } } }); tag(x + 3, y + 3, id + ': signature'); });
    else if (view === 'clips') {
      const list = [['strike', 0.27], ['strike2', 0.2], ['strike2', 0.36], ['windup', 0.42], ['release', 0.16], ['hit', 0.12], ['cheer', 0.3], ['stepF', 0.16], ['yield', 0.7], ['surrender', 0.5], ['teamLead', 0.5], ['teamFollow', 0.78]];
      list.forEach(([name, at], i) => { const x = (i % 3) * W / 3, y = Math.floor(i / 3) * H / 4; cells.push({ x, y, w: W / 3, h: H / 4, show: [who], shot: 'body', of: who, yaw: -62, pitch: 6, margin: 1.75, act: [name, at], state: { [who]: { face: 0, emote: name === 'hit' ? 'shock' : name === 'cheer' ? 'smile' : name === 'yield' ? 'tears' : 'anger' } } }); tag(x + 3, y + 3, `${name} @${at}`); });
    } else if (view === 'act') cells.push({ x: 0, y: 0, w: W, h: H, show: ids, at: ids.length > 1 ? { ren: [-0.3, 0], ilse: [-1.2, 0], bailiff: [1.2, 0] } : null, shot: ids.length > 1 ? 'band' : 'body', of: who, yaw: camYaw + 55, pitch: 6, margin: 1.9, state: ids.length > 1 ? { ren: { face: 90 }, ilse: { face: 90 }, bailiff: { face: -90 } } : { [who]: { face: 0 } } });
    else if (view === 'strip') { // frames of one figure over time, read left to right, top to bottom
      const cols = Math.min(4, stripN), rows = Math.ceil(stripN / cols), cw = W / cols, chh = Math.min(H / rows, cw * 1.5), shot = q.get('shot') || 'body';
      for (let i = 0; i < stripN; i++) { cells.push({ x: (i % cols) * cw, y: Math.floor(i / cols) * chh, w: cw, h: chh, show: [who], shot, of: who, yaw: camYaw + (shot === 'body' ? -30 : 18), pitch: 5, margin: shot === 'body' ? 1.5 : 1.5, advance: i === 0 ? 0 : stripStep, frame: i, state: {} }); tag((i % cols) * cw + 3, Math.floor(i / cols) * chh + 3, `+${(i * stripStep).toFixed(2)}s`); }
    } else if (view === 'crowd') {
      if (q.get('strip') === '1') { for (let i = 0; i < 6; i++) cells.push({ x: (i % 2) * W / 2, y: Math.floor(i / 2) * H / 3, w: W / 2, h: H / 3, show: [], shot: 'wide', yaw: camYaw, pitch: 12, advance: i === 0 ? 0 : stripStep, frame: i, state: {}, thin: true }); }
      else { cells.push({ x: 0, y: 0, w: W, h: Math.round(W * 220 / 430), show: [], shot: 'wide', yaw: camYaw, pitch: 10, state: {}, thin: true }); cells.push({ x: 0, y: Math.round(W * 220 / 430) + 10, w: W, h: H - Math.round(W * 220 / 430) - 10, show: [], shot: 'wide', near: true, yaw: camYaw + 20, pitch: 14, state: {} }); }
    }
    return cells;
  }
  let cells = [], lw = 0, lh = 0;
  const C3 = [0, 0, 0];
  function aim(cell) {
    const aspect = cell.w / cell.h, tv = Math.tan(cam.fov * DEG / 2), fit = (hgt, wid) => Math.max(hgt / 2 / tv, wid / 2 / (tv * aspect));
    if (cell.shot === 'band') { C3[0] = 0; C3[1] = 0.62; C3[2] = 0.2; cam.fov = 22; cam.orbit(C3, fit(1.5, 6.2), cell.yaw, cell.pitch); return 3.6; }
    if (cell.shot === 'wide') { C3[0] = 0; C3[1] = 0.5; C3[2] = -0.2; cam.fov = 24; cam.orbit(C3, cell.near ? fit(2.2, 3.0) : fit(1.6, 5.6), cell.yaw, cell.pitch); return 3.6; }
    const ch = cast[cell.of], p = ch.root.position;
    if (cell.shot === 'body') { C3[0] = p[0]; C3[1] = ch.height * 0.54; C3[2] = p[2]; cam.fov = 24; cam.orbit(C3, fit(ch.height * cell.margin, ch.height * 0.8 * cell.margin), cell.yaw, cell.pitch); return 1.5; }
    const hp = ch.headPos, hs = ch.headRadius * 2.25;
    if (cell.shot === 'head') { C3[0] = hp[0]; C3[1] = hp[1] + hs * 0.05; C3[2] = hp[2]; cam.fov = 20; cam.orbit(C3, fit(hs * cell.margin, hs * 0.9 * cell.margin), cell.yaw, cell.pitch); return 1.2; }
    // bust: head and shoulders with room below for subtitles, as a portrait phone cutscene frames a speaker
    C3[0] = hp[0]; C3[1] = hp[1] - hs * 0.42; C3[2] = hp[2]; cam.fov = 26; cam.orbit(C3, fit(hs * 3.3 * cell.margin, hs * 1.7 * cell.margin), cell.yaw, cell.pitch); return 1.6;
  }
  // the character light, as createTroupe.aim does it
  function aimKey(side = -1, lift = 0.4, across = 0.45) {
    let bx = cam.position[0] - cam.target[0], bz = cam.position[2] - cam.target[2]; const bl = Math.hypot(bx, bz) || 1; bx /= bl; bz /= bl;
    const rx = bz, rz = -bx, x = bx * 0.72 + rx * across * side, y = lift, z = bz * 0.72 + rz * across * side, l = Math.hypot(x, y, z);
    keyLight[0] = x / l; keyLight[1] = y / l; keyLight[2] = z / l;
  }

  // ---- time
  const actName = q.get('act'), actAt = q.has('at') ? Number(q.get('at')) : null, emoteSeq = (q.get('emote') || '').split(',');
  const WIND = [0, 0, 0], windOn = q.get('wind') === '1' || view === 'sheet' || view === 'lineup';
  const windOf = (t) => { if (!windOn) { WIND[0] = WIND[2] = 0; return WIND; } WIND[0] = 0.5 + Math.sin(t * 0.9) * 0.9; WIND[2] = Math.sin(t * 1.3) * 0.5; return WIND; };
  const live = {}; for (const k of keys) live[k] = { ...base };
  let simT = 0;
  function tick(t, dt) { // advance everyone once with the view's default state
    simT = t; clouds.update(t); sprites.update(dt);
    keys.forEach((k, i) => { const s = live[k]; s.wind = windOf(t + i); s.camera = cam; if (q.get('turn') === '1') s.face = Math.sin(t * 2.2) * 70; cast[k].update(dt, s); });
    if (crowd) crowd.update(dt, { mood: q.get('mood') || 'idle', energy: Number(q.get('energy') || 1) });
  }
  const cellState = {};
  function applyCell(cell) { // re-pose the cast for one cell without advancing time
    for (const k of keys) {
      const ch = cast[k]; ch.root.visible = cell.show.includes(k);
      if (!ch.root.visible) continue;
      const at = cell.at && cell.at[k]; ch.root.setPos(at ? at[0] : 0, 0, at ? at[1] : 0);
      if (cell.advance != null) continue; // a strip: the figure is as tick() left it
      const o = cell.state[k], s = cellState[k] || (cellState[k] = {});
      Object.assign(s, live[k]); s.talk = undefined; s.face = undefined; if (o) Object.assign(s, o); s.camera = cam; s.snap = true;
      if (cell.act && k === cell.of) { ch.release(); ch.act(cell.act[0]); ch.update(cell.act[1], s); ch.update(0, s); } else ch.update(0, s);
    }
    for (const k of keys) { const ch = cast[k]; if (!ch.glow) continue; ch.glow.visible = ch.root.visible; if (ch.root.visible) { ch.glow.pos[0] = ch.lampPos[0]; ch.glow.pos[1] = ch.lampPos[1]; ch.glow.pos[2] = ch.lampPos[2]; } }
  }

  const hud = document.getElementById('hud');
  if (q.get('hud') === '0') { hud.hidden = true; document.getElementById('bar').hidden = true; }
  const go = (k, list, cur) => () => { q.set(k, list[(list.indexOf(cur) + 1) % list.length]); location.search = q.toString(); };
  document.getElementById('bLight').onclick = go('light', LIGHTS, light);
  document.getElementById('bView').onclick = go('view', VIEWS, view);
  document.getElementById('bWho').onclick = go('who', ALL, who);

  const pre = fixedT ?? (view === 'strip' ? 3 : null);
  if (pre !== null) for (let t = Math.max(0, pre - 3); t < pre; t += 1 / 60) tick(t, 1 / 60);
  if (actName && view !== 'strip') { if (actName === 'team') teamMove(cast.ren, cast.ilse); else cast[who].act(actName); if (actAt !== null) for (let t = 0; t < actAt; t += 1 / 120) for (const k of keys) cast[k].update(1 / 120, live[k]); }
  let last = performance.now(), t = pre ?? 0, avg = 0, upd = 0, frames = 0, draws = 0, tris = 0, nextAct = 3, stripDone = false;
  const frozen = fixedT !== null || actAt !== null;
  function drawCell(cell) {
    const rad = aim(cell); cam.update(cell.w / cell.h); aimKey();
    // ink stays a constant width in pixels, which is far too heavy on a 70 px figure: thin it by how big a head is on screen
    const headPx = 0.46 * cell.h / (2 * Math.tan(cam.fov * DEG / 2) * Math.hypot(cam.position[0] - cam.target[0], cam.position[1] - cam.target[1], cam.position[2] - cam.target[2]));
    env.outline.width = cell.thin ? 0.7 : Math.max(0.42, Math.min(1, headPx / 150));
    applyCell(cell);
    const s = renderer.render(scene, cam, t, { x: cell.x, y: cell.y, w: cell.w, h: cell.h, shadowCenter: cam.target, shadowRadius: rad });
    draws += s.drawCalls; tris += s.triangles; return s.cpuMs;
  }
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    const W = canvas.clientWidth, H = canvas.clientHeight;
    if (W !== lw || H !== lh) { lw = W; lh = H; cells = layout(W, H); stripDone = false; }
    const isStrip = cells.length && cells[0].advance != null;
    if (isStrip) { // each cell is the next moment: advance the simulation between cells, once
      if (!stripDone) {
        stripDone = true; draws = 0; tris = 0;
        cells.forEach((cell, i) => {
          if (i === 0 && view === 'strip') { if (actName) cast[who].act(actName); if (emoteSeq.length > 1) live[who].emote = emoteSeq[0]; }
          if (view === 'strip' && emoteSeq.length > 1 && i === Math.floor(cells.length / 3)) live[who].emote = emoteSeq[1];
          for (let k = 0, n = Math.round(cell.advance * 120); k < n; k++) { t += 1 / 120; tick(t, 1 / 120); }
          drawCell(cell);
        });
      }
      frames++; window.glDemo.frames = frames; requestAnimationFrame(frame); return;
    }
    const u0 = performance.now();
    if (!frozen) { t += dt; tick(t, dt); if (view === 'act' && !actName && t > nextAct) { const names = Object.keys(CLIPS); cast[who].release(); cast[who].act(names[Math.floor(t / 2.2) % names.length]); nextAct = t + 2.2; } }
    upd += (performance.now() - u0 - upd) * 0.05;
    let cost = 0; draws = 0; tris = 0;
    for (let i = 0; i < cells.length; i++) cost += drawCell(cells[i]);
    avg += (cost - avg) * 0.05; frames++;
    if (!hud.hidden && frames % 15 === 0) hud.textContent = `${light} / ${view}  ${cells.length} views\n${draws} draws  ${(tris / 1000).toFixed(1)}k tris\nrender ${avg.toFixed(2)} ms  update ${upd.toFixed(2)} ms`;
    window.glDemo.frames = frames;
    requestAnimationFrame(frame);
  }
  window.glDemo = {
    renderer, cast, scene, faces, crowd, frames: 0,
    info() { const gl = renderer.gl, ext = gl.getExtension('WEBGL_debug_renderer_info'); return { renderer: ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER), draws, tris, views: cells.length, crowd: crowd ? crowd.stats : undefined, cast: Object.fromEntries(keys.map((k) => [k, cast[k].stats])) }; },
    /** Time n frames of animating every figure on the page, and of drawing the current view. */
    bench(n = 300, finish = false) {
      const gl = renderer.gl; let tu = 0, tr = 0, tt = t; const st = { emote: 'smile', speaking: true, look: 'camera', camera: cam, wind: WIND };
      for (let i = 0; i < n; i++) {
        tt += 1 / 60; const a = performance.now(); for (const k of keys) cast[k].update(1 / 60, st); if (crowd) crowd.update(1 / 60, { mood: 'cheer' }); const b2 = performance.now();
        for (const cell of cells) { aim(cell); cam.update(cell.w / cell.h); renderer.render(scene, cam, tt, { x: cell.x, y: cell.y, w: cell.w, h: cell.h }); }
        if (finish) gl.finish(); tu += b2 - a; tr += performance.now() - b2;
      }
      return { frames: n, updateMsPerCharacter: tu / n / Math.max(1, keys.length), updateMsAll: tu / n, renderMs: tr / n, finish, views: cells.length };
    },
  };
  requestAnimationFrame(frame);
} catch (e) { fatal(e); }
</script>
</body>
