name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write     # to move the play-good tag; nothing else is written
  pages: write
  id-token: write

# The sync daemon pushes every few minutes; only the newest push matters.
concurrency:
  group: pages
  cancel-in-progress: true

# The journal at / is rebuilt from every push. The game at /play/ is not: it is the
# newest snapshot that passed the game's tests AND whose browser modules all resolve.
# That snapshot is marked by the tag play-good, so a half-finished push (a module
# imported before it is written, a suite mid-rewrite) never replaces a working game
# at the URL people are sharing.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The game's own `npm test` is `node --test test/`, which needs a Node that accepts
      # a directory there; Node 22 reads it as a module path and fails before running
      # anything. 26 is what the game is developed and tested with.
      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Test the game core
        id: tests
        continue-on-error: true
        # pipefail: without it the step's status is tee's, and every run reads as passing.
        run: |
          set -o pipefail
          node --version
          if [ -d test ]; then node --test test/ 2>&1 | tee test-output.txt; fi

      - name: Check that every browser module the game imports exists
        id: imports
        continue-on-error: true
        run: node journal/check-imports.mjs index.html

      - name: Build the game (if it has a build step)
        run: |
          if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)" 2>/dev/null; then
            npm ci --ignore-scripts 2>/dev/null || npm install --ignore-scripts
            npm run build
          else
            echo "No build script: the game is zero-build ES modules, served as-is."
          fi

      - name: Choose the game snapshot for /play/
        id: pick
        run: |
          set -euo pipefail
          if [ "${{ steps.tests.outcome }}" = success ] && [ "${{ steps.imports.outcome }}" = success ]; then
            echo "this push is green: /play/ serves $GITHUB_SHA"
            echo "dir=." >> "$GITHUB_OUTPUT"; echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"; echo "green=true" >> "$GITHUB_OUTPUT"
          elif git fetch -q --depth=1 origin "refs/tags/play-good:refs/tags/play-good" 2>/dev/null; then
            good=$(git rev-parse play-good^{commit})
            mkdir -p /tmp/play-good && git archive play-good | tar -x -C /tmp/play-good
            echo "this push is not green (tests: ${{ steps.tests.outcome }}, imports: ${{ steps.imports.outcome }}): /play/ keeps $good"
            echo "dir=/tmp/play-good" >> "$GITHUB_OUTPUT"; echo "sha=$good" >> "$GITHUB_OUTPUT"; echo "green=false" >> "$GITHUB_OUTPUT"
          else
            echo "not green and no play-good tag yet: /play/ serves this push anyway"
            echo "dir=." >> "$GITHUB_OUTPUT"; echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"; echo "green=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p _site/play
          cp -R journal/. _site/
          rm -f _site/sync.mjs _site/check-imports.mjs
          G="${{ steps.pick.outputs.dir }}"

          # Pick the game's entry point. Order: a build output, a root index.html,
          # then any index.html the game ships elsewhere.
          if [ -f "$G/dist/index.html" ]; then
            cp -R "$G/dist/." _site/play/
            echo "game entry: dist/index.html"
          elif [ -f "$G/index.html" ]; then
            rsync -a --exclude journal --exclude .github --exclude .git --exclude _site --exclude node_modules "$G/" _site/play/
            echo "game entry: index.html"
          else
            entry=$(cd "$G" && find . -name index.html -not -path './journal/*' -not -path './_site/*' -not -path './node_modules/*' -not -path './.git/*' | sort | head -1)
            if [ -n "$entry" ]; then
              rsync -a --exclude journal --exclude .github --exclude .git --exclude _site --exclude node_modules "$G/" _site/play/
              target="${entry#./}"
              printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=%s"><a href="%s">%s</a>\n' "$target" "$target" "$target" > _site/play/index.html
              echo "game entry: $target"
            else
              cp journal/not-yet.html _site/play/index.html
              echo "game entry: none yet (placeholder)"
            fi
          fi

          # Share card for /play/. The game's own index.html is the game agent's file and is
          # not edited in the repo; tags are added to the deployed copy only, and only when
          # the game has not set its own og:title.
          if [ -f _site/play/index.html ] && ! grep -q 'property="og:title"' _site/play/index.html; then
            python3 - <<'PY'
          p = '_site/play/index.html'
          s = open(p, encoding='utf-8').read()
          base = 'https://notactuallytreyanastasio.github.io/the_long_settlement/'
          desc = ('A voiced story told on a pinball table that runs on a slot machine. '
                  'Debt, law and a rigged lottery, built live by an AI agent. Best with sound on.')
          tags = f'''
          <meta name="description" content="{desc}">
          <meta property="og:type" content="website">
          <meta property="og:site_name" content="The Long Settlement">
          <meta property="og:title" content="The Long Settlement: play the current build">
          <meta property="og:description" content="{desc}">
          <meta property="og:url" content="{base}play/">
          <meta property="og:image" content="{base}og-play.png">
          <meta property="og:image:width" content="1200">
          <meta property="og:image:height" content="630">
          <meta property="og:image:alt" content="The Long Settlement title screen: gold lettering over a harbour of lanterns at night. A treaty, a lot, a ledger.">
          <meta name="twitter:card" content="summary_large_image">
          <meta name="twitter:title" content="The Long Settlement: play the current build">
          <meta name="twitter:description" content="{desc}">
          <meta name="twitter:image" content="{base}og-play.png">
          '''
          i = s.lower().find('</head>')
          if i < 0:
              raise SystemExit('play/index.html has no </head>; cannot add share tags')
          open(p, 'w', encoding='utf-8').write(s[:i] + tags + s[i:])
          print('added share tags to play/index.html')
          PY
          fi

          # Build stamp the journal reads to show what Pages is serving.
          printf '{"sha":"%s","built":"%s","testsPassed":%s,"importsOk":%s,"playSha":"%s","playIsThisPush":%s}\n' \
            "$GITHUB_SHA" "$(date -u +%FT%TZ)" \
            "${{ steps.tests.outcome == 'success' }}" "${{ steps.imports.outcome == 'success' }}" \
            "${{ steps.pick.outputs.sha }}" "${{ steps.pick.outputs.green }}" > _site/data/build.json
          touch _site/.nojekyll

      - name: Mark this push as the newest playable game
        if: steps.pick.outputs.green == 'true'
        run: git push -f origin "$GITHUB_SHA:refs/tags/play-good"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
